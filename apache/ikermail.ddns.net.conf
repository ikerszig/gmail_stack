# Copy to /etc/apache2/sites-available/ikermail.ddns.net.conf on the raspi,
# then: a2ensite ikermail.ddns.net && apache2ctl configtest && systemctl reload apache2
#
# Modeled on the existing ikersync.ddns.net vhost (same IfModule wrapper,
# X-Forwarded-* headers, options-ssl-apache.conf include), plus one addition:
# this domain must NOT be reachable from outside LAN+VPN, even though Apache
# shares port 80/443 with other (internet-facing) vhosts on this host, and
# the firewall's HU-geoip allow rule is not scoped by port.
#
# The Include below (conf-available/require-lan-vpn.conf, 2026-08-06) enforces
# LAN-or-WireGuard-VPN access at the application layer - anyone else gets a
# 403, independent of firewall/router state. It's a shared snippet, not a
# bare `Require ip`, so the allowed networks are defined in exactly one place
# for every vhost that needs the same restriction.
#
# Note (2026-08-06): a bare "/" request returns a 302 (not 403) even from
# outside, because RewriteRule fires in the URL-translation phase, which runs
# BEFORE the <Location /> authorization check. This is not a hole - the
# redirect target (/mail/) is itself covered by the same <Location />, so it
# still 403s - but don't mistake the 302 on "/" for a broken restriction.

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName ikermail.ddns.net

    <Location />
        Include conf-available/require-lan-vpn.conf
    </Location>

    ProxyPreserveHost On
    ProxyTimeout 300

    # A vhostnak nincs sajat DocumentRootja, es a "/" utvonalra nincs proxy
    # sem - enelkul a keres a globalis alapertelmezett /var/www/html-re esne
    # vissza, ami a Debian "It works" oldalat tartalmazza. Ez felrevezeto
    # volt (2026-08-06-i lelet): azt a latszatot keltette, hogy a szolgaltatas
    # nincs beallitva. A gyoker mostantol a webmailre iranyit at.
    RewriteEngine On
    RewriteRule ^/$ /mail/ [R=302,L]

    # Roundcube webmail under /mail
    ProxyPass /mail/ http://172.28.0.30:80/
    ProxyPassReverse /mail/ http://172.28.0.30:80/

    # Radicale CalDAV under /radicale — needs X-Script-Name so Radicale
    # generates correct collection URLs under the subpath.
    ProxyPass /radicale/ http://172.28.0.20:5232/
    ProxyPassReverse /radicale/ http://172.28.0.20:5232/
    <Location /radicale/>
        RequestHeader set X-Script-Name /radicale
    </Location>

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port  "443"

    SSLCertificateFile /etc/letsencrypt/live/ikermail.ddns.net/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/ikermail.ddns.net/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
